[build]
  publish = "."

# Wildcard rewrites for nested sections
[[redirects]]
  from = "/auth/*"
  to = "/auth/:splat/index.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app/:splat/index.html"
  status = 200

[[redirects]]
  from = "/account/*"
  to = "/account/:splat/index.html"
  status = 200

[[redirects]]
  from = "/legal/*"
  to = "/legal/:splat/index.html"
  status = 200

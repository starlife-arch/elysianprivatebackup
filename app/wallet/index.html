<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wallet — DateVault</title><link rel="stylesheet" href="../../css/style.css"></head><body><div class="page-loader" id="loader"><div class="loader-logo">DateVault</div></div><div class="app-shell"><div class="topbar"><div class="topbar-title">Token Wallet</div></div><main style="padding:0 1rem 5.5rem"><section class="glass-card" style="text-align:center;margin-bottom:1rem"><div class="muted" style="font-size:12px">AVAILABLE TOKENS</div><div id="balance" style="font-family:'Cormorant Garamond',serif;font-size:3.4rem;color:var(--gold)">0</div><div class="muted" style="font-size:12px">100 tokens = $1</div></section><section class="glass-card" style="margin-bottom:1rem"><h3 style="margin-bottom:.75rem">Buy Tokens</h3><div id="packs" class="stack"></div></section><section class="glass-card" id="withdrawalCard" style="margin-bottom:1rem"><h3>Withdraw tokens</h3><p id="withdrawalHint" class="muted" style="font-size:13px;margin:.4rem 0 .75rem">3,000 tokens pays $15. Requests are paid manually.</p><div id="withdrawalForm" class="stack" style="display:none"><select id="withdrawMethod"><option value="">Select payout method</option><option>Bank</option><option>M-Pesa</option><option>PayPal</option><option>Crypto BEP-20</option></select><textarea id="withdrawDetails" placeholder="Payout account details" style="min-height:80px"></textarea><button class="btn btn-gold btn-full" id="withdrawBtn">Request $15 withdrawal</button></div></section><section class="glass-card"><h3 style="margin-bottom:.75rem">Recent activity</h3><div id="transactions" class="stack"></div></section></main></div><nav class="bottom-nav"><a class="nav-item" href="/app/dashboard/"><span>◉</span>Discover</a><a class="nav-item" href="/app/explore/"><span>⌕</span>Explore</a><a class="nav-item" href="/app/likes/"><span>♡</span>Likes</a><a class="nav-item active" href="/app/wallet/"><span>💰</span>Wallet</a><a class="nav-item" href="/app/chat/"><span>☏</span>Chat</a><a class="nav-item" href="/app/profile/"><span>◯</span>Profile</a></nav><div id="toast" class="toast"></div><script type="module">import { requireActiveMember, db } from '../../js/auth.js'; import { getWalletBalance,getTransactionHistory,requestWithdrawal } from '../../js/wallet.js'; import { collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'; const packs=[[100,1],[500,5],[1000,10],[2000,20],[5000,50],[10000,90]]; let uid; const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2400)}; async function load(){const s=await requireActiveMember();uid=s.user.uid;const balance=await getWalletBalance(uid);document.getElementById('balance').textContent=balance.toLocaleString();const pending=(await getDocs(query(collection(db,'withdrawals'),where('uid','==',uid),where('status','==','pending')))).size;document.getElementById('withdrawalForm').style.display=balance>=3000&&!pending?'flex':'none';document.getElementById('withdrawalHint').textContent=pending?'You have a pending withdrawal request.':(balance>=3000?'3,000 tokens pays $15. Requests are paid manually.':'You need '+(3000-balance).toLocaleString()+' more tokens to request a $15 withdrawal.');document.getElementById('packs').innerHTML=packs.map(([tokens,usd])=>`<button class="payment-option" onclick="location.href='/account/payment/?purpose=tokens&tokens=${tokens}&amount=${usd}'"><div class="payment-icon">✦</div><div><b>${tokens.toLocaleString()} Tokens</b><div style="font-size:12px;color:var(--muted)">$${usd}</div></div></button>`).join('');const tx=await getTransactionHistory(uid,20);document.getElementById('transactions').innerHTML=tx.length?tx.map(t=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid var(--border);padding:.5rem 0"><span>${t.note||t.type}</span><b style="color:${['debit','gift_sent','withdrawal_request','admin_debit'].includes(t.type)?'var(--danger)':'var(--success)'}">${['debit','gift_sent','withdrawal_request','admin_debit'].includes(t.type)?'−':'+'}${t.amount}</b></div>`).join(''):'<p class="muted">No transactions yet.</p>';document.getElementById('loader').classList.add('hidden')} document.getElementById('withdrawBtn').onclick=async()=>{try{await requestWithdrawal(uid,document.getElementById('withdrawMethod').value,document.getElementById('withdrawDetails').value);toast('Withdrawal request submitted.');load()}catch(e){toast(e.message)}};load().catch(e=>toast(e.message));</script></body></html>
